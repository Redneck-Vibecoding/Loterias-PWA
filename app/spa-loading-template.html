<div class="splash-container">
    <style>
        .splash-container {
            background: linear-gradient(145deg, #0f172a 0%, #1e3a8a 45%, #1d4ed8 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 9999;
        }

        .splash-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            color: #eff6ff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 24px;
        }

        .splash-icon-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .splash-icon-glow {
            position: absolute;
            width: 130px;
            height: 130px;
            border-radius: 32px;
            background: #60a5fa;
            filter: blur(24px);
            opacity: 0.35;
            animation: splashGlow 2.4s infinite ease-in-out;
        }

        .splash-icon {
            position: relative;
            width: 112px;
            height: 112px;
            border-radius: 26px;
            box-shadow: 0 16px 32px -8px rgba(0, 0, 0, 0.45);
            animation: splashPulse 2.4s infinite ease-in-out;
        }

        .splash-title {
            font-size: 1.625rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #ffffff;
            margin: 0;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .splash-subtitle {
            margin-top: 0.375rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: #bfdbfe;
            letter-spacing: 0.01em;
            opacity: 0.9;
        }

        .splash-loader {
            width: 140px;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 9999px;
            margin-top: 1.75rem;
            overflow: hidden;
            position: relative;
        }

        .splash-loader-bar {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 40%;
            background: linear-gradient(90deg, #60a5fa, #facc15);
            border-radius: 9999px;
            animation: splashLoading 1.6s infinite ease-in-out;
        }

        @keyframes splashPulse {
            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        @keyframes splashGlow {
            0%,
            100% {
                transform: scale(0.95);
                opacity: 0.25;
            }

            50% {
                transform: scale(1.15);
                opacity: 0.45;
            }
        }

        @keyframes splashLoading {
            0% {
                left: -40%;
            }

            50% {
                left: 100%;
            }

            100% {
                left: 100%;
            }
        }
    </style>
    <div class="splash-content">
        <div class="splash-icon-wrapper">
            <div class="splash-icon-glow"></div>
            <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" class="splash-icon" role="img" aria-label="LotoControl">
                <defs>
                    <linearGradient id="splashLogoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#3b82f6" />
                        <stop offset="50%" stop-color="#1d4ed8" />
                        <stop offset="100%" stop-color="#1e3a8a" />
                    </linearGradient>
                    <linearGradient id="splashGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#fef08a" />
                        <stop offset="40%" stop-color="#facc15" />
                        <stop offset="100%" stop-color="#ca8a04" />
                    </linearGradient>
                    <filter id="splashGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.3" />
                    </filter>
                </defs>
                <rect width="512" height="512" rx="116" fill="url(#splashLogoBgGrad)" />
                <rect x="10" y="10" width="492" height="492" rx="106" fill="none" stroke="#93c5fd" stroke-width="4" stroke-opacity="0.3" />
                <g transform="translate(4, -4)" filter="url(#splashGlowFilter)">
                    <g transform="rotate(-10 240 260)">
                        <rect x="120" y="150" width="240" height="160" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="4" />
                        <circle cx="120" cy="230" r="14" fill="url(#splashLogoBgGrad)" />
                        <circle cx="360" cy="230" r="14" fill="url(#splashLogoBgGrad)" />
                        <line x1="140" y1="230" x2="340" y2="230" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 6" />
                        <rect x="145" y="170" width="190" height="20" rx="6" fill="#1d4ed8" />
                        <circle cx="170" cy="265" r="10" fill="#3b82f6" opacity="0.8" />
                        <circle cx="215" cy="265" r="10" fill="#3b82f6" opacity="0.8" />
                        <circle cx="260" cy="265" r="10" fill="#3b82f6" opacity="0.8" />
                        <circle cx="305" cy="265" r="10" fill="#10b981" />
                    </g>
                    <g transform="translate(290, 290)">
                        <circle cx="0" cy="0" r="66" fill="url(#splashGoldGrad)" stroke="#fef08a" stroke-width="4" />
                        <circle cx="0" cy="0" r="46" fill="#ffffff" />
                        <text x="0" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#1e3a8a" text-anchor="middle">7</text>
                    </g>
                    <path d="M 180,130 L 186,146 L 202,146 L 190,156 L 194,172 L 180,162 L 166,172 L 170,156 L 158,146 L 174,146 Z" fill="#fef08a" opacity="0.9" />
                    <path d="M 380,160 L 384,172 L 396,172 L 387,180 L 390,192 L 380,184 L 370,192 L 373,180 L 364,172 L 376,172 Z" fill="#6ee7b7" opacity="0.9" />
                </g>
            </svg>
        </div>
        <h1 class="splash-title">LotoControl</h1>
        <div class="splash-subtitle">Control de Boletos y Premios de Lotería</div>
        <div class="splash-loader">
            <div class="splash-loader-bar"></div>
        </div>
    </div>
</div>
